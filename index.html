{<html>
<head>
<style>
body { font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
.sidebar { width: 200px; background-color: #2c3e50; color: white; padding: 20px; }
.sidebar a { display: block; color: white; text-decoration: none; padding: 10px 0; border-bottom: 1px solid #34495e; }
.content { flex: 1; padding: 20px; background-color: #ecf0f1; }
.tabs { margin-bottom: 20px; border-bottom: 2px solid #bdc3c7; }
.tabs a { margin-right: 20px; text-decoration: none; color: #7f8c8d; font-weight: bold; padding-bottom: 5px; display: inline-block; }
.tabs a.active { color: #e74c3c; border-bottom: 2px solid #e74c3c; }
.tab-content { display: none; }
.tab-content.active { display: block; }
</style>
</head>
<body>
<div class="sidebar">
<h2>Menu</h2>
<a href="#projets" onclick="showTabGroup('projets')">Projets</a>
<a href="#materiel" onclick="showTabGroup('materiel')">Matériel</a>
<a href="#ressources" onclick="showTabGroup('ressources')">Ressources</a>
</div>
<div class="content">
<div id="projets" class="tab-group">
<div class="tabs">
<a href="#" class="active" onclick="showTab(event, 'p1')">Projet 1</a>
<a href="#" onclick="showTab(event, 'p2')">Projet 2</a>
<a href="#" onclick="showTab(event, 'p3')">Projet 3</a>
</div>
<div id="p1" class="tab-content active">Contenu du Projet 1</div>
<div id="p2" class="tab-content">Contenu du Projet 2</div>
<div id="p3" class="tab-content">Contenu du Projet 3</div>
</div>
<div id="materiel" class="tab-group" style="display:none;">
<h3>Matériel</h3>
<p>Détails sur le matériel utilisé.</p>
</div>
<div id="ressources" class="tab-group" style="display:none;">
<h3>Ressources</h3>
<p>Liens et documents utiles.</p>
</div>
</div>
<script>
function showTabGroup(id) {
document.querySelectorAll('.tab-group').forEach(group => group.style.display = 'none');
document.getElementById(id).style.display = 'block';
}
function showTab(event, tabId) {
const group = event.target.closest('.tab-group');
group.querySelectorAll('.tabs a').forEach(tab => tab.classList.remove('active'));
group.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
event.target.classList.add('active');
document.getElementById(tabId).classList.add('active');
}
</script>
</body>
</html>}
